<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Test Reader">
<meta name="theme-color" content="#2C2416">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Dressage Test Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sand: #F5F0E8;
    --sand-dark: #E8E0D0;
    --arena: #2C2416;
    --arena-mid: #4A3F2C;
    --gold: #C8972A;
    --gold-light: #E8B84B;
    --text: #1A1410;
    --text-mid: #5A4E38;
    --text-light: #8A7A62;
    --white: #FEFCF8;
  }
  html, body {
    height: 100%;
    background: var(--arena);
    color: var(--sand);
    font-family: 'Crimson Pro', Georgia, serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100svh;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  }

  /* ── Selector screen ── */
  .selector-screen {
    display: flex;
    flex-direction: column;
    position: fixed;
    inset: 0;
    background: var(--arena);
    padding: max(env(safe-area-inset-top), 2rem) 1.5rem max(env(safe-area-inset-bottom), 1.5rem);
    z-index: 200;
  }
  .selector-screen.hidden { display: none; }
  .selector-hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    text-align: center;
    padding-bottom: 1rem;
  }
  .selector-icon { font-size: 2.5rem; color: var(--gold); margin-bottom: 0.25rem; }
  .selector-title { font-size: 1.5rem; font-weight: 600; color: var(--sand); letter-spacing: 0.01em; }
  .selector-subtitle { font-size: 0.72rem; font-family: 'DM Mono', monospace; color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase; }
  .selector-list { display: flex; flex-direction: column; gap: 0.75rem; padding-bottom: 0.5rem; }
  .test-card {
    width: 100%;
    padding: 1.1rem 1.4rem;
    background: rgba(200,151,42,0.07);
    border: 0.5px solid rgba(200,151,42,0.3);
    border-radius: 14px;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  .test-card:active { background: rgba(200,151,42,0.18); }
  .test-card-name { font-size: 1.2rem; font-weight: 600; color: var(--sand); margin-bottom: 3px; }
  .test-card-detail { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--gold); letter-spacing: 0.06em; }

  /* ── Main app ── */
  .header {
    padding: 1.25rem 1.5rem 0.75rem;
    border-bottom: 0.5px solid rgba(200,151,42,0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header-left { display: flex; flex-direction: column; gap: 2px; }
  .test-title { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; color: var(--sand); }
  .test-subtitle { font-size: 0.75rem; font-family: 'DM Mono', monospace; color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase; }
  .counter { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--text-light); background: rgba(200,151,42,0.12); padding: 4px 10px; border-radius: 20px; border: 0.5px solid rgba(200,151,42,0.2); }
  .main { flex: 1; display: flex; flex-direction: column; padding: 1.25rem 1.5rem; gap: 1rem; overflow: hidden; }
  .idle-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; text-align: center; }
  .arena-mark { width: 72px; height: 72px; border: 1.5px solid rgba(200,151,42,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--gold); }
  .idle-hint { font-size: 1.15rem; color: var(--sand-dark); font-style: italic; }
  .idle-sub { font-size: 0.8rem; font-family: 'DM Mono', monospace; color: var(--text-light); letter-spacing: 0.06em; }
  .movement-card { background: var(--white); color: var(--text); border-radius: 16px; padding: 1.25rem 1.25rem 1rem; display: none; flex-direction: column; gap: 0.6rem; flex-shrink: 0; }
  .movement-card.active { display: flex; }
  .move-header { display: flex; align-items: center; gap: 10px; }
  .move-badge { background: var(--arena); color: var(--gold); font-family: 'DM Mono', monospace; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.06em; white-space: nowrap; }
  .move-number { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text-light); letter-spacing: 0.08em; }
  .move-instruction { font-size: 1.35rem; font-weight: 600; line-height: 1.35; color: var(--text); }
  .move-parts { display: flex; flex-direction: column; gap: 0.6rem; }
  .move-part { display: flex; gap: 0.6rem; align-items: baseline; }
  .move-part-marker { background: var(--arena); color: var(--gold); font-family: 'DM Mono', monospace; font-size: 0.72rem; padding: 3px 9px; border-radius: 20px; letter-spacing: 0.06em; white-space: nowrap; flex-shrink: 0; }
  .move-part-text { font-size: 1.2rem; font-weight: 600; line-height: 1.35; color: var(--text); }
  .move-directive { font-size: 0.9rem; color: var(--text-mid); font-style: italic; line-height: 1.5; border-top: 0.5px solid #E8E0D0; padding-top: 0.6rem; }
  .replay-btn { align-self: flex-end; margin-top: 0.25rem; background: none; border: 0.5px solid rgba(200,151,42,0.3); border-radius: 8px; color: var(--gold); font-size: 1.1rem; padding: 4px 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  /* Arena diagram */
  .arena-svg { width: 100%; display: block; margin: 0.1rem 0; }
  .arena-svg .arena-field { fill: rgba(200,151,42,0.04); stroke: rgba(200,151,42,0.22); stroke-width: 1.5; }
  .arena-svg .arena-cl { stroke: rgba(200,151,42,0.1); stroke-width: 0.75; stroke-dasharray: 3,3; }
  .arena-svg .am circle { fill: #2C2416; stroke: rgba(200,151,42,0.18); stroke-width: 1; transition: fill 0.2s, stroke 0.2s; }
  .arena-svg .am text { fill: rgba(200,151,42,0.3); font-family: 'DM Mono', monospace; font-size: 7.5px; text-anchor: middle; dominant-baseline: middle; transition: fill 0.2s; }
  .arena-svg .am.active circle { fill: var(--gold); stroke: var(--gold-light); stroke-width: 1.5; }
  .arena-svg .am.active text { fill: #2C2416; font-weight: bold; }
  .next-preview { background: rgba(200,151,42,0.08); border: 0.5px solid rgba(200,151,42,0.2); border-radius: 10px; padding: 0.7rem 1rem; display: none; flex-direction: column; gap: 3px; flex-shrink: 0; }
  .next-preview.active { display: flex; }
  .next-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase; }
  .next-text { font-size: 0.95rem; color: rgba(245,240,232,0.7); font-style: italic; }
  .done-state { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; text-align: center; }
  .done-state.active { display: flex; }
  .done-mark { font-size: 3rem; color: var(--gold-light); }
  .done-title { font-size: 1.6rem; font-weight: 600; color: var(--sand); }
  .done-sub { font-size: 1rem; font-style: italic; color: var(--text-light); }
  .controls { padding: 0.75rem 1.5rem 1.25rem; display: flex; flex-direction: column; gap: 0.6rem; flex-shrink: 0; border-top: 0.5px solid rgba(200,151,42,0.15); }
  .btn-primary { width: 100%; padding: 1rem; background: var(--gold); color: var(--arena); border: none; border-radius: 12px; font-family: 'DM Mono', monospace; font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: background 0.15s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
  .btn-primary:active { background: var(--gold-light); transform: scale(0.98); }
  .btn-secondary { width: 100%; padding: 0.75rem; background: transparent; color: var(--text-light); border: 0.5px solid rgba(200,151,42,0.25); border-radius: 10px; font-family: 'DM Mono', monospace; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn-secondary:active { background: rgba(200,151,42,0.1); }
  .voice-status { text-align: center; font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--gold); letter-spacing: 0.06em; min-height: 1rem; opacity: 0.8; }
  .voice-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin-right: 5px; vertical-align: middle; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  .hidden { display: none !important; }

  /* ── Review screen ── */
  .review-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--arena);
    flex-direction: column;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    z-index: 100;
  }
  .review-screen.active { display: flex; }
  .review-header {
    padding: 1.25rem 1.5rem 0.75rem;
    border-bottom: 0.5px solid rgba(200,151,42,0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .review-title { font-size: 1.1rem; font-weight: 600; color: var(--sand); }
  .review-close { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--gold); background: none; border: none; cursor: pointer; letter-spacing: 0.06em; -webkit-tap-highlight-color: transparent; }
  .review-scroll { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; -webkit-overflow-scrolling: touch; }
  .review-purpose {
    font-size: 0.88rem;
    color: var(--text-light);
    font-style: italic;
    line-height: 1.55;
    padding: 0.75rem 1rem;
    border: 0.5px solid rgba(200,151,42,0.15);
    border-radius: 10px;
    margin-bottom: 1rem;
  }
  .review-row {
    display: grid;
    grid-template-columns: 2.5rem 1fr;
    gap: 0.5rem 0.75rem;
    padding: 0.75rem 0;
    border-bottom: 0.5px solid rgba(200,151,42,0.12);
    align-items: start;
  }
  .review-row:last-child { border-bottom: none; }
  .review-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--gold);
    background: rgba(200,151,42,0.12);
    border-radius: 50%;
    width: 1.6rem;
    height: 1.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .review-content { display: flex; flex-direction: column; gap: 6px; }
  .review-parts { display: flex; flex-direction: column; gap: 0.4rem; }
  .review-part { display: flex; gap: 0.6rem; align-items: baseline; }
  .review-part-marker { background: var(--arena-mid); color: var(--gold); font-family: 'DM Mono', monospace; font-size: 0.68rem; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.06em; white-space: nowrap; flex-shrink: 0; }
  .review-part-text { font-size: 0.95rem; font-weight: 600; color: var(--sand); line-height: 1.35; }
  .review-directive { font-size: 0.82rem; color: var(--text-light); font-style: italic; line-height: 1.4; }
  .review-footer { padding: 0.75rem 1.25rem 1.25rem; flex-shrink: 0; border-top: 0.5px solid rgba(200,151,42,0.15); }
  /* Voice picker */
  .voice-picker { margin-top: 0.5rem; }
  .voice-picker-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--text-light); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.4rem; }
  .voice-select { width: 100%; padding: 0.65rem 0.9rem; background: rgba(200,151,42,0.07); border: 0.5px solid rgba(200,151,42,0.25); border-radius: 10px; color: var(--sand); font-family: 'Crimson Pro', Georgia, serif; font-size: 1rem; appearance: none; -webkit-appearance: none; cursor: pointer; }
  .voice-select option { background: #2C2416; color: #F5F0E8; }
</style>
</head>
<body>

<!-- Test selector (shown on launch) -->
<div class="selector-screen" id="selector-screen">
  <div class="selector-hero">
    <div class="selector-icon">✦</div>
    <div class="selector-title">Dressage Test Reader</div>
    <div class="selector-subtitle">USEF 2023 · Training Level</div>
  </div>
  <div class="selector-list" id="selector-list"></div>
  <div class="voice-picker">
    <div class="voice-picker-label">Voice</div>
    <select class="voice-select" id="voice-select" onchange="selectVoice(this.value)">
      <option value="">Default</option>
    </select>
  </div>
  <button class="btn-secondary" id="mic-btn" onclick="toggleMic()" style="margin-top:0.5rem">Enable Microphone</button>
</div>

<!-- Review screen (overlay) -->
<div class="review-screen" id="review-screen">
  <div class="review-header">
    <div class="review-title" id="review-title"></div>
    <button class="review-close" onclick="closeReview()">Close ✕</button>
  </div>
  <div class="review-scroll">
    <div class="review-purpose" id="review-purpose"></div>
    <div id="review-list"></div>
  </div>
  <div class="review-footer">
    <button class="btn-primary" onclick="closeReview(); startTest()">Start Test</button>
  </div>
</div>

<!-- Main app -->
<div class="header">
  <div class="header-left">
    <div class="test-title" id="header-title"></div>
    <div class="test-subtitle">USEF 2023</div>
  </div>
  <div class="counter" id="counter">0 / —</div>
</div>

<div class="main">
  <div class="movement-card" id="movement-card">
    <div class="move-header">
      <div class="move-badge" id="move-marker"></div>
      <div class="move-number" id="move-number"></div>
    </div>
    <svg class="arena-svg" viewBox="0 0 300 82" xmlns="http://www.w3.org/2000/svg">
      <rect x="26" y="14" width="248" height="54" rx="2" class="arena-field"/>
      <line x1="26" y1="41" x2="274" y2="41" class="arena-cl"/>
      <g id="am-A"  class="am"><circle cx="26"  cy="41" r="8"/><text x="26"  y="41">A</text></g>
      <g id="am-K"  class="am"><circle cx="51"  cy="14" r="7"/><text x="51"  y="14">K</text></g>
      <g id="am-F"  class="am"><circle cx="51"  cy="68" r="7"/><text x="51"  y="68">F</text></g>
      <g id="am-E"  class="am"><circle cx="150" cy="14" r="7"/><text x="150" y="14">E</text></g>
      <g id="am-B"  class="am"><circle cx="150" cy="68" r="7"/><text x="150" y="68">B</text></g>
      <g id="am-H"  class="am"><circle cx="249" cy="14" r="7"/><text x="249" y="14">H</text></g>
      <g id="am-M"  class="am"><circle cx="249" cy="68" r="7"/><text x="249" y="68">M</text></g>
      <g id="am-C"  class="am"><circle cx="274" cy="41" r="8"/><text x="274" y="41">C</text></g>
      <g id="am-X"  class="am"><circle cx="150" cy="41" r="7"/><text x="150" y="41">X</text></g>
    </svg>
    <div class="move-instruction" id="move-instruction"></div>
    <div class="move-directive" id="move-directive"></div>
    <button class="replay-btn" onclick="replaySpeak()" title="Replay">🔊</button>
  </div>

  <div class="next-preview" id="next-preview">
    <div class="next-label">Next</div>
    <div class="next-text" id="next-text"></div>
  </div>

  <div class="done-state" id="done-state">
    <div class="done-mark">✦</div>
    <div class="done-title">Test complete.</div>
    <div class="done-sub">Well ridden.</div>
  </div>
</div>

<div class="controls">
  <div class="voice-status" id="voice-status"></div>
  <button class="btn-primary  hidden" id="next-btn"    onclick="nextMove()">Next →</button>
  <button class="btn-secondary hidden" id="restart-btn" onclick="restartTest()">Restart</button>
  <button class="btn-secondary hidden" id="change-test-btn" onclick="showSelector()">Change Test</button>
  <button class="btn-secondary hidden" id="mic-off-btn" onclick="toggleMic()">Disable Microphone</button>
</div>

// iOS: unlock speech synthesis on first user touch
document.addEventListener('touchstart', function unlock() {
  window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  document.removeEventListener('touchstart', unlock);
}, { once: true });

// iOS: keep speech synthesis alive when screen dims
setInterval(() => { if (window.speechSynthesis.paused) window.speechSynthesis.resume(); }, 4000);

      { marker:"C / H–X–K",       text:"Track left. Slightly after H, begin a single loop to X returning to the track slightly before K.",     directive:"Regularity and quality of trot; bend and balance in turns; shape and size of loop; changes of bend; balance." },
      { marker:"Between A & F",   text:"Working canter left lead.",                                                                            directive:"Willing calm transition; regularity and quality of gaits; bend in corner; straightness." },

      { marker:"H–X–F / X",       text:"Change rein. Working trot.",                                                                          directive:"Regularity and quality of gaits; willing calm transition; straightness; bend in corner." },

      { marker:"K–X–H / H",       text:"Free walk. Medium walk.",                                                                             directive:"Regularity and quality of walks; reach, overtrack, and ground cover of free walk allowing complete freedom to stretch the neck forward and downward; straightness; willing calm transitions." },
      { marker:"C / M–X–F",       text:"Working trot. Slightly after M, begin a single loop to X returning to the track slightly before F.",   directive:"Regularity and quality of trot; shape and size of loop; changes of bend and balance." },
      { marker:"Between A & K",   text:"Working canter right lead.",                                                                          directive:"Willing calm transition; regularity and quality of gaits; bend and balance in corner; straightness." },
      { marker:"E",               text:"Circle right 20m.",                                                                                    directive:"Regularity and quality of canter; shape and size of circle; bend; balance." },
      { marker:"C",               text:"Working trot.",                                                                                        directive:"Willing calm transition; regularity and quality of trot." },
      { marker:"B",               text:"Circle right 20m in rising trot, allowing the horse to stretch forward and downward. Before B, shorten the reins. Working trot.", directive:"Forward and downward stretch over the back into a light contact, maintaining balance and quality of trot; bend; shape and size of circle; willing calm transitions." },
      { marker:"A / X",           text:"Down centerline. Halt, salute.",                                                                      directive:"Bend and balance in turn; regularity and quality of trot; willing calm transition; straight, attentive halt; immobile (min. 3 sec). Leave arena at A in free walk." }

// ── State ──��─────────────────────────────────��───────────────────────────────

let selectedTest = null;
let current = -1;
let recognition = null;
let micActive = false;
let lastSpoken = '';
let commandFired = false;
let synthActive = false;
let preferredVoice = null;

function initVoice() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;
  const englishVoices = voices.filter(v => v.lang.startsWith('en'));
  if (!englishVoices.length) return;

  // Populate picker
  const sel = document.getElementById('voice-select');
  const current = sel.value;
  sel.innerHTML = '<option value="">Default</option>';
  englishVoices.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = v.name + (v.default ? ' ✓' : '');
    sel.appendChild(opt);
  });
  if (current) sel.value = current;

  // Auto-select: prefer any non-compact, non-default English voice; fall back to first
  if (!preferredVoice) {
    preferredVoice =
      englishVoices.find(v => v.lang === 'en-US' && !v.default && !/compact/i.test(v.name)) ||
      englishVoices.find(v => v.lang.startsWith('en') && !v.default) ||
      englishVoices[0];
    if (preferredVoice) sel.value = preferredVoice.name;
  }
}

function selectVoice(name) {
  const voices = window.speechSynthesis.getVoices();
  preferredVoice = name ? voices.find(v => v.name === name) || null : null;
}

initVoice();
window.speechSynthesis.onvoiceschanged = initVoice;

function makeUtterance(text, rate) {
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate || 0.88;
  u.pitch = 1.0;
  if (preferredVoice) u.voice = preferredVoice;
  return u;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ── Selector ─────���───────────────────────────────────────────────────────────

const selectorList = document.getElementById('selector-list');
TESTS.forEach((t, i) => {
  const btn = document.createElement('button');
  btn.className = 'test-card';
  btn.innerHTML = '<div class="test-card-name">' + t.name + '</div><div class="test-card-detail">' + t.detail + '</div>';
  btn.onclick = () => selectTest(i);
  selectorList.appendChild(btn);
});

function showSelector() {
  if (micActive) { recognition && recognition.stop(); micActive = false; }
  synthActive = false; commandFired = false;
  window.speechSynthesis && window.speechSynthesis.cancel();
  synthActive = false; commandFired = false;
  document.getElementById('selector-screen').classList.remove('hidden');
  document.getElementById('movement-card').classList.remove('active');
  document.getElementById('next-preview').classList.remove('active');
  document.getElementById('done-state').classList.remove('active');
  document.getElementById('next-btn').classList.add('hidden');
  document.getElementById('restart-btn').classList.add('hidden');
  document.getElementById('change-test-btn').classList.add('hidden');
  document.getElementById('mic-off-btn').classList.add('hidden');
  updateMicUI(micActive);
  updateVoiceStatus();
}

function selectTest(idx) {
  selectedTest = TESTS[idx];
  document.getElementById('selector-screen').classList.add('hidden');
  document.getElementById('header-title').textContent = selectedTest.name;
  buildReview();
  startTest();
}

// ── Review ────���──────────────────────────────────────────────────────────────

function buildReview() {
  document.getElementById('review-title').textContent = selectedTest.name;
  document.getElementById('review-purpose').textContent = selectedTest.purpose;
  const list = document.getElementById('review-list');
  list.innerHTML = '';
  selectedTest.movements.forEach((m, i) => {
    const markerParts = m.marker.split(' / ');
    const textParts = m.parts || splitSentences(m.text);
    const isPaired = markerParts.length > 1 && markerParts.length === textParts.length;

    const pairsHTML = isPaired
      ? '<div class="review-parts">' +
          markerParts.map((mk, j) =>
            '<div class="review-part">' +
              '<div class="review-part-marker">' + mk + '</div>' +
              '<div class="review-part-text">' + textParts[j] + '</div>' +
            '</div>'
          ).join('') +
        '</div>'
      : '<div class="review-part">' +
          '<div class="review-part-marker">' + m.marker + '</div>' +
          '<div class="review-part-text">' + m.text + '</div>' +
        '</div>';

    const row = document.createElement('div');
    row.className = 'review-row';
    row.innerHTML =
      '<div class="review-num">' + (i + 1) + '</div>' +
      '<div class="review-content">' +
        pairsHTML +
        '<div class="review-directive">' + m.directive + '</div>' +
      '</div>';
    list.appendChild(row);
  });
}

function openReview() {
  document.getElementById('review-screen').classList.add('active');
  document.getElementById('review-screen').querySelector('.review-scroll').scrollTop = 0;
}

function closeReview() {
  document.getElementById('review-screen').classList.remove('active');
}

// ── Speech ────────────────────────────────���──────────────────────────────────

function speak(text) {
  if (!window.speechSynthesis) return;
  lastSpoken = text;
  synthActive = true;
  if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
  setTimeout(() => {
    const u = makeUtterance(text);
    u.onend = u.onerror = () => { synthActive = false; commandFired = false; };
    window.speechSynthesis.speak(u);
  }, 150);
}

function splitSentences(text) {
  const parts = text.split(/\.\s+(?=[A-Z])/);
  return parts.map((s, i) => i < parts.length - 1 ? s + '.' : s);
}

function speakMovement(rawMarker, instruction, explicitParts) {
  if (!window.speechSynthesis) return;
  lastSpoken = rawMarker + '. ' + instruction;
  synthActive = true;
  if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();

  const markerParts = rawMarker.split(' / ');
  const textParts = explicitParts || splitSentences(instruction);
  const pairs = (markerParts.length > 1 && markerParts.length === textParts.length)
    ? markerParts.map((m, i) => [markerForSpeech(m), textParts[i]])
    : [[markerForSpeech(rawMarker), instruction]];

  const allWords = pairs.flat().join(' ').split(/\s+/).length;
  const pauseMs = (pairs.length - 1) * 1500;
  const estimatedMs = Math.ceil(allWords / 2.5 * 1000) + pauseMs + 2000;

  const restartMic = () => {
    clearTimeout(fallback);
    synthActive = false; commandFired = false;
  };
  const fallback = setTimeout(restartMic, estimatedMs);

  function speakPair(idx) {
    if (idx >= pairs.length) { restartMic(); return; }
    const [markerText, instrText] = pairs[idx];
    const u1 = makeUtterance(markerText, 0.78);
    u1.onend = () => {
      setTimeout(() => {
        const u2 = makeUtterance(instrText);
        u2.onend = () => {
          if (idx < pairs.length - 1) setTimeout(() => speakPair(idx + 1), 1500);
          else restartMic();
        };
        u2.onerror = restartMic;
        window.speechSynthesis.speak(u2);
      }, 400);
    };
    u1.onerror = restartMic;
    window.speechSynthesis.speak(u1);
  }

  setTimeout(() => speakPair(0), 350);
}

function replaySpeak() {
  if (current >= 0 && selectedTest) {
    const m = selectedTest.movements[current];
    speakMovement(m.marker, m.text, m.parts);
  }
}

const ARENA_IDS = ['A','B','C','E','F','H','K','M','X'];

function updateArena(rawMarker) {
  const active = new Set(
    rawMarker.toUpperCase().replace(/–/g, '-').split(/[^A-Z]+/).filter(p => ARENA_IDS.includes(p))
  );
  ARENA_IDS.forEach(id => {
    const el = document.getElementById('am-' + id);
    if (el) el.classList.toggle('active', active.has(id));
  });
}

function markerForSpeech(m) {
  return m
    .replace(/–/g, ', ')
    .replace(/\s*\/\s*/g, ', ')
    .replace(/\s*&\s*/g, ' and ')
    .toLowerCase()
    // Comma after each letter in "between x and y" so TTS pauses and reads them as letters not words
    .replace(/between (\w) and (\w)/g, 'between $1, and $2');
}

// ── Test flow ───────��─────────────────────────────────────────────────────────


function showMovement(idx) {
  const mvs = selectedTest.movements;
  const m = mvs[idx];
  document.getElementById('done-state').classList.remove('active');
  document.getElementById('movement-card').classList.add('active');
  document.getElementById('move-number').textContent = 'MOVEMENT ' + (idx + 1) + ' OF ' + mvs.length;
  document.getElementById('move-directive').textContent = m.directive;

  const instrEl = document.getElementById('move-instruction');
  const markerEl = document.getElementById('move-marker');
  const markerParts = m.marker.split(' / ');
  const textParts = m.parts || splitSentences(m.text);
  if (markerParts.length > 1 && markerParts.length === textParts.length) {
    markerEl.style.display = 'none';
    instrEl.innerHTML = '<div class="move-parts">' +
      markerParts.map((mk, i) =>
        '<div class="move-part">' +
          '<div class="move-part-marker">' + mk + '</div>' +
          '<div class="move-part-text">' + textParts[i] + '</div>' +
        '</div>'
      ).join('') +
    '</div>';
  } else {
    markerEl.style.display = 'none';
    instrEl.innerHTML = '<div class="move-parts">' +
      '<div class="move-part">' +
        '<div class="move-part-marker">' + m.marker + '</div>' +
        '<div class="move-part-text">' + m.text + '</div>' +
      '</div>' +
    '</div>';
  }
  const np = document.getElementById('next-preview');
  if (idx + 1 < mvs.length) {
    document.getElementById('next-text').textContent = mvs[idx + 1].marker + ' — ' + mvs[idx + 1].text;
    np.classList.add('active');
  } else {
    np.classList.remove('active');
  }
  document.getElementById('counter').textContent = (idx + 1) + ' / ' + mvs.length;
  updateArena(m.marker);
  updateVoiceStatus();
  speakMovement(m.marker, m.text, m.parts);
}

function startTest() {
  current = 0;
  document.getElementById('done-state').classList.remove('active');
  document.getElementById('next-btn').classList.remove('hidden');
  document.getElementById('restart-btn').classList.add('hidden');
  document.getElementById('change-test-btn').classList.remove('hidden');
  document.getElementById('mic-off-btn').classList.toggle('hidden', !micActive);
  showMovement(current);
}

function nextMove() {
  current++;
  if (current < selectedTest.movements.length) {
    showMovement(current);
  } else {
    endTest();
  }
}

function endTest() {
  document.getElementById('movement-card').classList.remove('active');
  document.getElementById('next-preview').classList.remove('active');
  document.getElementById('done-state').classList.add('active');
  document.getElementById('next-btn').classList.add('hidden');
  document.getElementById('restart-btn').classList.remove('hidden');
  document.getElementById('counter').textContent = selectedTest.movements.length + ' / ' + selectedTest.movements.length;
  speak('Test complete. Well ridden.');
}

function restartTest() {
  synthActive = false; commandFired = false;
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.getElementById('restart-btn').classList.add('hidden');
  document.getElementById('next-btn').classList.remove('hidden');
  startTest();
}

function selectAndStartTest(idx) {
  if (idx >= TESTS.length) return;
  window.speechSynthesis && window.speechSynthesis.cancel();
  synthActive = false; commandFired = false;
  selectTest(idx);
}

function updateVoiceStatus() {
  if (!micActive) return;
  document.getElementById('voice-status').innerHTML =
    current >= 0
      ? '<span class="voice-dot"></span>Next · Repeat · Restart · Test 1/2/3'
      : '<span class="voice-dot"></span>Say Test 1, Test 2, or Test 3';
}

// ── Voice ──────��──────────────────────────────────────────────────────────────

function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    document.getElementById('voice-status').textContent = 'Voice not supported in this browser';
    return;
  }
  if (micActive) {
    recognition && recognition.stop();
    micActive = false;
    synthActive = false; commandFired = false;
    updateMicUI(false);
    document.getElementById('voice-status').textContent = '';
  } else {
    startRecognition();
  }
}

function updateMicUI(active) {
  document.getElementById('mic-btn').textContent = active ? 'Microphone On' : 'Enable Microphone';
  const offBtn = document.getElementById('mic-off-btn');
  if (offBtn) offBtn.classList.toggle('hidden', !active);
}

function startRecognition() {
  if (!recognition) {
    // Create the object once — reusing it avoids repeated permission prompts on Chrome iOS
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';
    recognition.onstart = () => {
      micActive = true;
      updateMicUI(true);
      updateVoiceStatus();
    };
    recognition.onresult = (e) => {
      const result = e.results[e.results.length - 1];
      const t = result[0].transcript.trim().toLowerCase();
      if (result.isFinal) { commandFired = false; return; }
      if (commandFired) return;
      if      (t.match(/\btest (one|1)\b/))                                                                          { commandFired = true; selectAndStartTest(0); }
      else if (t.match(/\btest (two|to+|2)\b/))                                                                      { commandFired = true; selectAndStartTest(1); }
      else if (t.match(/\btest (three|3)\b/))                                                                        { commandFired = true; selectAndStartTest(2); }
      else if (t.includes('go back') || t.includes('home'))                                                          { commandFired = true; showSelector(); }
      else if (t.includes('restart'))                                                                                 { commandFired = true; restartTest(); }
      else if (t.includes('repeat') && current >= 0)                                                                 { commandFired = true; replaySpeak(); }
      else if (t.includes('start') && current < 0 && selectedTest)                                                   { commandFired = true; startTest(); }
      else if ((t.includes('next') || (t.includes('go') && !t.includes('go back'))) && current >= 0 && current < selectedTest.movements.length) { commandFired = true; nextMove(); }
    };
    recognition.onerror = (e) => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      document.getElementById('voice-status').textContent = 'Mic error: ' + e.error;
      micActive = false;
      updateMicUI(false);
    };
    recognition.onend = () => {
      if (micActive && !synthActive) {
        commandFired = false;
        setTimeout(() => { try { recognition.start(); } catch(err) {} }, 150);
      }
    };
  }
  try { recognition.start(); } catch(err) {}
}
